name: Dummy Deploy (Production)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simulate Production Deploy
        run: |
          echo "🚀 Deploying to Production Environment..."
          echo "✅ Production Deploy Completed Successfully!"

      - name: Generate and Push Tag Release
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hard Reset Staging (Clean up)
        run: |
          git push origin HEAD:refs/heads/staging --force

